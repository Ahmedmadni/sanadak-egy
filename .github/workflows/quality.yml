name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging/sanadak-isolated-s0]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Environment hygiene
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be tracked. Use .env.example plus deployment secrets."
            exit 1
          fi
          if git grep -n -E '^(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|SERVICE_ROLE_KEY|PRIVATE_KEY)=[^[:space:]]+' -- ':!*.example' ':!docs/**'; then
            echo "::error::Potential privileged secret value found in tracked source."
            exit 1
          fi

      - name: Verify Staging source isolation
        if: github.ref == 'refs/heads/staging/sanadak-isolated-s0'
        run: node scripts/validate-staging-isolation.mjs

      - name: Verify manually executed Staging migration ledger
        if: github.ref == 'refs/heads/staging/sanadak-isolated-s0'
        run: node scripts/verify-staging-migration-ledger.mjs

      - name: Prepare next Staging migration (dry run only)
        if: github.ref == 'refs/heads/staging/sanadak-isolated-s0'
        run: node scripts/prepare-next-staging-migration.mjs --check

      - name: Lint
        # Pre-existing formatting/no-explicit-any debt is tracked separately.
        # Keep all other ESLint correctness rules release-blocking.
        run: >-
          bunx eslint .
          --rule 'prettier/prettier: off'
          --rule '@typescript-eslint/no-explicit-any: off'

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
